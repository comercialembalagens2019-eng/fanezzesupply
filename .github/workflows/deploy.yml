# Deploys on every push to main: database migrations, edge functions and the site.
# Needs the repository secret SUPABASE_ACCESS_TOKEN; the site job also needs
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and is skipped until they exist.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: krmrnoqkkimhlmbcinmd

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to enable deploys."
            exit 1
          fi
      # Provider keys live only in GitHub secrets; copy the ones that exist to the
      # edge-function environment so there is a single place to manage them.
      - name: Sync edge function secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
          ABACATEPAY_PUBLIC_KEY: ${{ secrets.ABACATEPAY_PUBLIC_KEY }}
          ABACATEPAY_WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: |
          # The Asaas webhook token is derived from the API key, so only ASAAS_API_KEY has
          # to be added by hand; scripts/asaas-webhook.mjs registers the same token at Asaas.
          if [ -n "$ASAAS_API_KEY" ] && [ -z "$ASAAS_WEBHOOK_TOKEN" ]; then
            ASAAS_WEBHOOK_TOKEN=$(printf 'fnz-asaas-webhook:%s' "$ASAAS_API_KEY" | sha256sum | cut -d' ' -f1)
          fi
          # Same for the AbacatePay webhook secret (scripts/abacatepay-webhook.mjs).
          if [ -n "$ABACATEPAY_API_KEY" ] && [ -z "$ABACATEPAY_WEBHOOK_SECRET" ]; then
            ABACATEPAY_WEBHOOK_SECRET=$(printf 'fnz-abacate-webhook:%s' "$ABACATEPAY_API_KEY" | sha256sum | cut -d' ' -f1)
          fi
          if [ -n "$ABACATEPAY_WEBHOOK_SECRET" ]; then
            echo "::add-mask::$ABACATEPAY_WEBHOOK_SECRET"
            echo "ABACATEPAY_WEBHOOK_SECRET=$ABACATEPAY_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$ASAAS_WEBHOOK_TOKEN" ]; then
            echo "::add-mask::$ASAAS_WEBHOOK_TOKEN"
            echo "ASAAS_WEBHOOK_TOKEN=$ASAAS_WEBHOOK_TOKEN" >> "$GITHUB_ENV"
          fi
          args=()
          for name in RESEND_API_KEY ABACATEPAY_API_KEY ABACATEPAY_PUBLIC_KEY ABACATEPAY_WEBHOOK_SECRET \
                      STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); echo "will set $name"; fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            npx -y supabase@2.122.0 secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
          else
            echo "No provider secrets in GitHub yet."
          fi
      # Migrations run before functions: new function code may depend on new columns.
      - name: Apply database migrations
        run: node scripts/supabase-migrate.mjs
      - name: Apply auth settings (redirects, Resend SMTP, PT-BR e-mails)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/supabase-auth-config.mjs
      - name: Deploy edge functions
        run: npx -y supabase@2.122.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Register the Asaas payment webhook
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/asaas-webhook.mjs
      - name: Register the AbacatePay payment webhook
        env:
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
        run: node scripts/abacatepay-webhook.mjs

  site:
    needs: supabase
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet; skipping site deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.cf.outputs.enabled == 'true'
        name: Build against the self-hosted Supabase project
        run: npm run build
        env:
          # Public values (they ship in the browser bundle anyway).
          VITE_SUPABASE_URL: https://krmrnoqkkimhlmbcinmd.supabase.co
          VITE_SUPABASE_PROJECT_ID: krmrnoqkkimhlmbcinmd
          # AbacatePay public key (pk_...) for the card form; the card option stays hidden without it.
          VITE_ABACATEPAY_PUBLIC_KEY: ${{ secrets.ABACATEPAY_PUBLIC_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtybXJub3Fra2ltaGxtYmNpbm1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDQ4MDYsImV4cCI6MjEwODc4MDgwNn0.vTOvHltI_T1xrexkHTjp-e98SwxLEknhIcOpN3Q4aCM' }}
      - if: steps.cf.outputs.enabled == 'true'
        name: SPA fallback for client-side routes
        run: echo "/* /index.html 200" > dist/_redirects
      - if: steps.cf.outputs.enabled == 'true'
        name: Create the Pages project on first deploy
        run: npx -y wrangler@4 pages project create fnzsupply --production-branch main || true
      - if: steps.cf.outputs.enabled == 'true'
        name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy dist --project-name fnzsupply --branch main
