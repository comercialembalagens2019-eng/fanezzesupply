name: Clean up Resend DNS

# Manual: removes the legacy Amazon SES MX/TXT on send.fanezzesupply.com.br once Resend's
# Forge CNAME is there. Safe to re-run.
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove legacy send records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-resend-dns.mjs
