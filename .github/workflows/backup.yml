# Weekly data backup (all public tables + accounts) kept as a private workflow
# artifact for 90 days. Restore = migrations from the repo + these JSON files.
name: Supabase backup

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: krmrnoqkkimhlmbcinmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to enable backups."
            exit 1
          fi
      - name: Export data
        run: node scripts/supabase-backup.mjs "backup-$(date -u +%Y-%m-%d)"
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*/
          retention-days: 90
